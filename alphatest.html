<!doctype html>
<!-- Per-atom opacity proof page (3Dmol.js issue #166 work, 2026-08-09).
     Loads OUR dev bundle and renders one structure entirely as sphere imposters:
       residues 1-120  -> opacity 0.25  (should render as ghosts)
       everything else -> opaque
     Definitive A/B: swap the script src to 3Dmol-min.js and stock instead renders
     EVERYTHING opaque + logs "Warning: sphere opacity is ambiguous" to the console. -->
<html>
<head>
<meta charset="utf-8">
<title>per-atom alpha test</title>
<style>
  html,body { margin:0; height:100%; background:#0a0e13; color:#8a94a8;
              font:13px/1.4 Consolas,monospace; }
  #mol { position:absolute; inset:0; }
  #tag { position:absolute; top:10px; left:12px; z-index:2; }
  #tag b { color:#e6ebf5; }
</style>
</head>
<body>
<div id="tag"><b>alphatest</b> — resi 1–120 @ 0.25 · rest opaque · bundle: <b id="which"></b></div>
<div id="mol"></div>
<script src="3Dmol-dev.js"></script>
<script>
document.getElementById('which').textContent =
    document.querySelector('script[src^="3Dmol"]').getAttribute('src');
const viewer = $3Dmol.createViewer(document.getElementById('mol'),
    { backgroundColor: 'white', antialias: true });
fetch('O05011_af.pdb')
  .then(r => r.text())
  .then(pdb => {
    viewer.addModel(pdb, 'pdb');
    // THE use case (issue #166): fade the bulk, keep the core solid -- focus + context.
    // element colors throughout -- solidity alone separates focus from context
    viewer.setStyle({}, { sphere: { scale: 0.35, opacity: 0.3 } });
    viewer.addStyle({ resi: '60-80' }, { sphere: { opacity: 1.0 } });
    viewer.zoomTo();
    viewer.render();
    // ---- diagnostic dump: where does the alpha chain break? ----
    setTimeout(() => {
      const out = [];
      const m = viewer.getModel(0);
      const root = m.renderedMolObj || m.molObj;
      const meshes = [];
      (function walk(o){ if(!o) return; if(o.geometry && o.material) meshes.push(o);
        (o.children||[]).forEach(walk); })(root);
      out.push('meshes: ' + meshes.length);
      meshes.forEach((mesh,i) => {
        const mat = mesh.material, geo = mesh.geometry;
        const groups = geo.geometryGroups || [];
        const g0 = groups[0] || {};
        out.push(`#${i} shader=${mat.shaderID||mat.constructor.name} transparent=${mat.transparent} opacity=${mat.opacity}` +
          ` | geo.alpha=${geo.alpha} groups=${groups.length}` +
          ` | alphaArray=${g0.alphaArray ? 'len ' + g0.alphaArray.length + ' [' + Array.from(g0.alphaArray.slice(0,6)).join(',') + '...]' : 'null'}` +
          ` | buffer=${g0.__webglAlphaBuffer !== undefined}`);
      });
      console.log('ALPHATEST DIAG\n' + out.join('\n'));
      document.getElementById('tag').innerHTML += '<pre style="max-width:90vw;white-space:pre-wrap">' + out.join('\n') + '</pre>';
    }, 1500);
  })
  .catch(e => document.getElementById('tag').textContent = 'load failed: ' + e);
</script>
</body>
</html>
