<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Probble · AlphaFold structure library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="probble.css">
<style>
  /* The library: the four fold classes are the sidebar's tags and every structure is a card. Probble's own flat look
     (probble.css, Jay 2026-11-24: "We'll need a barebones one"); it was a glass window on HomePage's desktop kit before. */
  :root { --a: #ff7e5a; --b: #4f9bff; --ab: #46d1a0; --few: #8aa0b8; }
  #win-fv .lg-search input { width: 230px; }
  .fv-tag::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--tag); }
  .fv-count { margin-left: auto; font-size: 11px; color: var(--lg-text-3); font-variant-numeric: tabular-nums; }
  .fv-grp h2 { display: flex; align-items: center; gap: 8px; margin: 16px 4px 10px; font-size: 13px; font-weight: 700; color: var(--lg-text-2); }
  .fv-grp h2 .ct { font-weight: 500; color: var(--lg-text-3); }
  #empty { display: none; padding: 30px 6px; color: var(--lg-text-2); }
  #empty b { color: var(--lg-text); }
</style>
</head>
<body class="lg-desktop">
<main class="lg-workspace" id="workspace">
  <section class="lg-window" id="win-fv" aria-label="AlphaFold structure library">
    <aside data-level="1" class="lg-sidebar" data-drag>
      <div class="lg-traffic">
        <button class="lg-tl lg-tl-close" aria-label="Close"></button>
        <button class="lg-tl lg-tl-min" aria-label="Minimize"></button>
        <button class="lg-tl lg-tl-zoom" aria-label="Zoom"></button>
      </div>
      <div class="lg-side-head">Library</div>
      <button class="lg-side-item is-selected" data-cls=""><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>All Structures<span class="fv-count" id="ct-all"></span></button>
      <button class="lg-side-item fv-tag" data-cls="ens" style="--tag:#e9b85a" id="side-ens" hidden>Ensembles<span class="fv-count" id="ct-ens"></span></button>
      <div class="lg-side-head">Fold classes</div>
      <div id="fv-tags"></div>
    </aside>
    <div class="lg-main">
      <div class="lg-toolbar" data-drag>
        <div data-level="1" class="lg-capsule">
          <button disabled aria-label="Back"><svg viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg></button>
          <button disabled aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg></button>
        </div>
        <h1 class="lg-title">AlphaFold structure library</h1>
        <span class="lg-spacer"></span>
        <label data-level="1" class="lg-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <input id="q" placeholder="Search, or a UniProt accession" autocomplete="off" spellcheck="false"/>
        </label>
      </div>
      <div class="lg-content">
        <div id="main"></div>
        <div id="empty"><b id="qval"></b> isn't in the library. It looks like an accession: press Enter to open it on demand.</div>
      </div>
      <!-- NO LINE AT THE FOOT (Jay, 2026-11-14: "no need for those windows with texts at the very bottom ... Remove the text at the bottom"): the counts
           under the library went; the sidebar has them. .lg-content is HomePage's main pane, so the library ends on the window's foot and scrolls there -->
    </div>
  </section>
</main>

<script>
const CLS = [
  {key:'Mainly alpha', label:'Mainly α', varc:'--a'},
  {key:'Mainly beta',  label:'Mainly β', varc:'--b'},
  {key:'Alpha + beta', label:'α + β',    varc:'--ab'},
  {key:'Few SS',       label:'Few SS',   varc:'--few'},
];
// ENSEMBLES: experimental entries with many models of one protein. Their cards open the renderer with
// ?pdb=, which draws confidence from how far each residue moves across the models, not from pLDDT.
let SHOW_ENS = false, ENS_INDEX = {};   // ENS_INDEX: {accession: {pdb, models, residues}} from ensembles.json, Jay only               // the Ensembles shelf is Jay's only, like the renderer's Ensemble tab
// THE PRIVATE SHELF READS ITS LIST FROM private_sets.json (Jay only, not in git): lab-measured sets, simulator
// output (BioEmu) and anything added later, one page for all of them (Jay, 2026-11-24: "I really dont like the idea
// of cloning pages for identical behaviour"). Each entry: {pdb, name, len, source: 'lab'|'simulated', note}.
let ENSEMBLES = [];
const ACC_RE = /^[A-NR-Z][0-9][A-Z0-9]{3}[0-9]$|^[OPQ][0-9][A-Z0-9]{3}[0-9]$/i;
// TEMPORARY: cards open the all-3Dmol renderer (three.js removed) instead of explore.html, so a
// real catalog protein flows straight into it. Options: '3DMolProtein.html' (all-3Dmol),
// 'foldbench.html' (the morph benchmark), 'explore.html' (the original three.js build).
const TARGET = '3DMolProtein.html';
let ROWS = [];
let ONLY = '';                       // the sidebar's fold class ('' = every class)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Every structure is a plain card (probble.css .pb-card): its name, accession and length, its fold class as the
// accent, its helix and sheet shares as chips; a click opens it in the renderer.
// UniProt's name field strings the recommended name and every alternative name and EC number together
// ("Annexin A4 (35-beta calcimedin) (Annexin IV) ..."): the card shows the recommended name, the tooltip the rest.
const short = n => String(n).split(' (')[0];
const pct = v => Number.isFinite(v) ? Math.round(v * 100) + '%' : null;
function card(r){
  const c = CLS.find(k => k.key === r.cls) || CLS[3];
  const href = TARGET + '?acc=' + encodeURIComponent(r.acc) + '&name=' + encodeURIComponent(short(r.name));
  const chips = [pct(r.ph) && pct(r.ph) + ' helix', pct(r.ps) && pct(r.ps) + ' sheet'].filter(Boolean);
  return '<a class="pb-card" style="--accent:var(' + c.varc + ')" href="' + esc(href) + '" title="' + esc(r.name) + '"><b>' + esc(short(r.name)) + '</b>'
    + '<span class="ctx">UniProt ' + esc(r.acc) + ' · ' + esc(r.len) + ' residues</span>'
    + '<span class="chips">' + chips.map(x => '<span>' + esc(x) + '</span>').join('') + measured(r) + '</span></a>';
}
// A library protein with a lab-measured set gets a gold label; clicking it (not the tile) opens that set in the
// renderer's Ensemble tab. Its tooltip says how much of the protein the set covers.
function measured(r){
  const e = SHOW_ENS && ENS_INDEX[r.acc.toUpperCase()]; if (!e) return '';
  const href = TARGET + '?pdb=' + encodeURIComponent(e.pdb) + '&name=' + encodeURIComponent(short(r.name)) + '&tab=ens';
  const tip = e.pdb + ': ' + e.models + ' measured versions, covering ' + e.residues + ' of ' + r.len + ' amino acids';
  return '<span class="pb-ens" data-href="' + esc(href) + '" title="' + esc(tip) + '">lab · ' + e.models + ' versions</span>';
}
function ensCard(e){
  const href = TARGET + '?pdb=' + encodeURIComponent(e.pdb) + '&name=' + encodeURIComponent(e.name) + '&tab=ens';
  return '<a class="pb-card" style="--accent:#e9b85a" href="' + esc(href) + '" title="' + esc(e.name) + '"><b>' + esc(e.name) + '</b>'
    + '<span class="ctx">' + (e.source === 'simulated' ? 'BioEmu' : 'PDB ' + esc(e.pdb)) + ' · ' + esc(e.len) + ' amino acids</span>'
    + '<span class="chips"><span>' + esc(e.source === 'simulated' ? 'simulated' : 'lab') + '</span><span>' + esc(e.note) + '</span></span></a>';
}
function render(filter){
  const main = document.getElementById('main'); main.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  let shown = 0;
  if (SHOW_ENS && (!ONLY || ONLY === 'ens')) {
    const es = ENSEMBLES.filter(e => !f || e.name.toLowerCase().includes(f) || e.pdb.toLowerCase().includes(f));
    if (es.length) {
      shown += es.length;
      const g = document.createElement('div'); g.className = 'fv-grp';
      g.innerHTML = '<h2><span class="fv-tag" style="--tag:#e9b85a"></span>Ensembles <span class="ct">' + es.length + '</span></h2>';
      const grid = document.createElement('div'); grid.className = 'lg-tiles'; grid.innerHTML = es.map(ensCard).join('');
      g.appendChild(grid); main.appendChild(g);
    }
  }
  if (ONLY === 'ens') { document.getElementById('empty').style.display = 'none'; return; }
  for (const c of CLS) {
    if (ONLY && c.key !== ONLY) continue;
    const rows = ROWS.filter(r => r.cls === c.key && (!f || r.name.toLowerCase().includes(f) || r.acc.toLowerCase().includes(f)));
    if (!rows.length) continue;
    shown += rows.length;
    const g = document.createElement('div'); g.className = 'fv-grp';
    g.innerHTML = '<h2><span class="fv-tag" style="--tag:var(' + c.varc + ')"></span>' + c.label + ' <span class="ct">' + rows.length + '</span></h2>';
    const grid = document.createElement('div'); grid.className = 'lg-tiles';
    grid.innerHTML = rows.map(card).join('');
    g.appendChild(grid); main.appendChild(g);
  }
  // accession-lookup affordance: no name matches but the query looks like an accession
  const emp = document.getElementById('empty');
  if (!shown && ACC_RE.test(f)) { emp.style.display = 'block'; document.getElementById('qval').textContent = f.toUpperCase(); }
  else emp.style.display = 'none';
}

const q = document.getElementById('q');
q.addEventListener('input', () => render(q.value));
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = q.value.trim().toUpperCase();
    if (ACC_RE.test(v)) location.href = TARGET + '?acc=' + encodeURIComponent(v); }
});

// The library, with the fold classes as the sidebar's tags.
const win = document.getElementById('win-fv');
document.getElementById('fv-tags').innerHTML = CLS.map(c => '<button class="lg-side-item fv-tag" data-cls="' + c.key
  + '" style="--tag:var(' + c.varc + ')">' + c.label + '<span class="fv-count" data-ct="' + c.key + '"></span></button>').join('');
win.querySelector('.lg-sidebar').addEventListener('click', e => {
  const b = e.target.closest('[data-cls]');
  if (!b) return;
  win.querySelectorAll('[data-cls]').forEach(x => x.classList.toggle('is-selected', x === b));
  ONLY = b.dataset.cls;
  render(q.value);
});


fetch('catalog.json').then(r => r.json()).then(rows => {
  ROWS = rows;
  const by = {}; CLS.forEach(c => by[c.key] = 0); rows.forEach(r => by[r.cls] = (by[r.cls] || 0) + 1);
  document.getElementById('ct-all').textContent = rows.length;
  CLS.forEach(c => { win.querySelector('[data-ct="' + c.key + '"]').textContent = by[c.key]; });
  render('');
  fetch('/mode', {cache: 'no-store'}).then(r => r.ok ? r.json() : {}).then(m => {
    if (m.mode !== 'jay') return;
    SHOW_ENS = true; document.getElementById('side-ens').hidden = false;
    const get = (f, empty) => fetch(f, {cache: 'no-store'}).then(r => r.ok ? r.json() : empty).catch(() => empty);
    return Promise.all([get('ensembles.json', {}), get('private_sets.json', [])]).then(([ix, sets]) => { ENS_INDEX = ix; ENSEMBLES = sets;
      document.getElementById('ct-ens').textContent = ENSEMBLES.length;
      document.getElementById('ct-all').textContent = rows.length + ENSEMBLES.length;
      render(q.value); });
  }).catch(() => {});
  // a click on a tile's lab label opens the measured set, not the tile's AlphaFold model
  document.getElementById('main').addEventListener('click', e => {
    const lab = e.target.closest('.pb-ens'); if (!lab) return;
    e.preventDefault(); e.stopPropagation(); location.href = lab.dataset.href;
  });
});
</script>
</body>
</html>
