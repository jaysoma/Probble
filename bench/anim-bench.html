<meta charset="utf-8">
<title>3Dmol animation path benchmark</title>
<!--
  WHAT THIS MEASURES, AND WHY THIS SHAPE.

  David Koes asked, of the coordinate-replay patch: "Is the main benefit not deallocating/
  reallocating memory do you think?" That is a question about WHICH cost dominates, and only a
  comparison answers it. So this runs the SAME animation twice over the same model and reports
  frame time and heap for each path:

    BASELINE  viewer.setFrame(i)      -- GLModel.setFrame swaps model.atoms and sets
                                         molObj = null, so the next globj() rebuilds every
                                         geometry: style resolution per atom, colours, radii,
                                         face indices, fresh typed arrays, full buffer upload.
    FAST      syncAtomPositions()     -- rewrites position data in the existing arrays and lets
                                         the renderer respecify only the affected buffers.

  Both produce the same picture. Only the update path differs, which is what makes the delta
  attributable.

  THE SIZE SWEEP IS THE POINT. A single protein gives a ratio; a sweep gives a SHAPE. If
  regeneration scales with atom count and replay does not, the curve is the argument -- and that
  is a stronger claim than any single number.

  HONEST LIMITS, recorded here so they travel with the numbers:
    * performance.memory is Chrome-only and coarse. It is sampled with
      --enable-precise-memory-info, and read as CHURN (how much is allocated per frame) rather
      than as a peak, because peak heap says little about GC pressure.
    * Headless Chrome may rasterize through SwiftShader. That inflates the cost of anything
      GPU-bound equally for both paths, so the COMPARISON holds, but absolute frame times are not
      representative of Jay's iGPU. The driver records which renderer was used.
    * Frames are synthesised (a smooth torsion-like distortion), not a real MD trajectory. What
      matters is that atom positions change every frame by a realistic magnitude; the physics is
      irrelevant to the cost being measured.
-->
<style>
  html, body { margin: 0; background: #0b0d12; color: #cfd6e4;
               font: 13px ui-monospace, Consolas, monospace; }
  #view { width: 900px; height: 600px; position: relative; }
  #out { white-space: pre; padding: 10px; }
</style>

<div id="view"></div>
<pre id="out">idle</pre>

<script src="../3Dmol-anim.js"></script>
<script>
/* global $3Dmol */

const OUT = document.getElementById('out');
const log = m => { OUT.textContent += '\n' + m; };

/** A smooth, whole-molecule distortion. Every atom moves every frame -- which is the worst case
 *  for the baseline and the fair case for the replay. Amplitude is in angstroms and is deliberately
 *  large enough that no frame is a no-op. */
function displace(atoms, t) {
  for (let i = 0; i < atoms.length; i++) {
    const a = atoms[i];
    const phase = (i / atoms.length) * Math.PI * 4;
    a.x = a.ox + Math.sin(phase + t) * 3.0;
    a.y = a.oy + Math.cos(phase * 0.7 + t) * 2.0;
    a.z = a.oz + Math.sin(phase * 1.3 + t) * 1.5;
  }
}

const heap = () => (performance.memory ? performance.memory.usedJSHeapSize : 0);

/** Median and p95 -- the mean is the wrong summary for frame time, because one GC pause drags it
 *  and hides the typical experience. */
function stats(xs) {
  const s = [...xs].sort((a, b) => a - b);
  const at = q => s[Math.min(s.length - 1, Math.floor(s.length * q))];
  return { median: +at(0.5).toFixed(3), p95: +at(0.95).toFixed(3),
           min: +s[0].toFixed(3), max: +s[s.length - 1].toFixed(3) };
}

/** One frame, rendered and awaited. rAF rather than a bare loop: without yielding to the
 *  compositor the browser batches work and the per-frame numbers become meaningless. */
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

async function runOne(acc, frames) {
  const res = { acc, frames };
  const el = document.getElementById('view');
  el.innerHTML = '';

  const pdb = await (await fetch('../structures/' + acc + '.pdb')).text();
  const viewer = $3Dmol.createViewer(el, { backgroundColor: '#0b0d12' });
  const model = viewer.addModel(pdb, 'pdb');

  // Sticks AND spheres: this exercises both imposter paths the patch covers, and it is the style
  // FoldView actually animates in.
  model.setStyle({}, { stick: { radius: 0.15 }, sphere: { scale: 0.22 } });
  viewer.zoomTo();
  viewer.render();
  await nextFrame();

  const atoms = model.selectedAtoms({});
  atoms.forEach(a => { a.ox = a.x; a.oy = a.y; a.oz = a.z; });
  res.atoms = atoms.length;
  res.bonds = atoms.reduce((n, a) => n + (a.bonds ? a.bonds.length : 0), 0) / 2;

  // ---- BASELINE: setFrame ----------------------------------------------------------------
  // Frames are added up front so the measured loop contains only what setFrame does per frame:
  // swap atoms, null molObj, rebuild on render. Building the frame list is setup, not cost.
  for (let f = 0; f < frames; f++) {
    displace(atoms, f * 0.25);
    model.addFrame(atoms.map(a => Object.assign({}, a)));
  }
  atoms.forEach(a => { a.x = a.ox; a.y = a.oy; a.z = a.oz; });

  const baseT = [], h0 = heap();
  for (let f = 0; f < frames; f++) {
    const t = performance.now();
    await model.setFrame(f);
    viewer.render();
    await nextFrame();
    baseT.push(performance.now() - t);
  }
  res.baseline = stats(baseT);
  res.baseline.heapDeltaMB = +(((heap() - h0) / 1048576)).toFixed(2);

  // ---- FAST: syncAtomPositions -----------------------------------------------------------
  // Back to frame 0 and a full rebuild once, so the replay starts from valid geometry -- the
  // method returns false if the model has never been rendered.
  await model.setFrame(0);
  viewer.render();
  await nextFrame();

  const live = model.selectedAtoms({});
  live.forEach(a => { a.ox = a.x; a.oy = a.y; a.oz = a.z; });

  const fastT = [], h1 = heap();
  let refused = 0;
  for (let f = 0; f < frames; f++) {
    const t = performance.now();
    displace(live, f * 0.25);
    if (model.syncAtomPositions() !== true) refused++;
    viewer.render();
    await nextFrame();
    fastT.push(performance.now() - t);
  }
  res.fast = stats(fastT);
  res.fast.heapDeltaMB = +(((heap() - h1) / 1048576)).toFixed(2);
  // A refusal means the fast path declined and a real caller would have fallen back -- the
  // numbers would then be measuring nothing. Reported rather than averaged away.
  res.fastRefused = refused;

  res.speedup = +(res.baseline.median / Math.max(res.fast.median, 1e-6)).toFixed(2);
  viewer.clear();
  return res;
}

window.runBench = async function (accs, frames) {
  const out = { started: new Date().toISOString(), frames, results: [], renderer: 'unknown' };
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
    if (dbg) out.renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
  } catch (_) {}
  out.preciseMemory = !!performance.memory;

  for (const acc of accs) {
    OUT.textContent = 'running ' + acc + ' (' + (out.results.length + 1) + '/' + accs.length + ')';
    try {
      const r = await runOne(acc, frames);
      out.results.push(r);
      log(acc + '  atoms=' + r.atoms + '  base=' + r.baseline.median +
          'ms  fast=' + r.fast.median + 'ms  x' + r.speedup);
    } catch (e) {
      out.results.push({ acc, error: String(e && e.stack || e) });
      log(acc + '  FAILED ' + e);
    }
  }
  out.finished = new Date().toISOString();
  window.__BENCH__ = out;
  return out;
};
</script>
